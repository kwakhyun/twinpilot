[project]
name = "twinpilot-mcp"
version = "0.1.0"
description = "TwinPilot digital twin spatial analysis MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[project.scripts]
twinpilot-mcp = "twinpilot_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinpilot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
