[project]
name = "twinpilot-mcp"
version = "0.2.0"
description = "TwinPilot digital twin spatial analysis MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.28,<0.29",
    "pyjwt[crypto]>=2.15,<3",
    "uvicorn>=0.54,<1",
    "prometheus-client>=0.26,<1",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-asgi>=0.66b1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[project.scripts]
twinpilot-mcp = "twinpilot_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinpilot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
