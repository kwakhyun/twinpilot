name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # 통합 테스트는 Testcontainers로 postgis/postgis:16-3.5-alpine(운영 이미지의 베이스)과 테스트용 OIDC 발급자를 쓴다.
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [mcp-server, ai-agent]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # 운영 이미지와 같은 해시 고정 의존성으로 설치한 뒤 테스트 도구만 더한다.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e . && pip install "pytest>=9,<10" "pytest-asyncio>=1.4,<2"
      - run: pytest -q
      # 경량판 데모 로그인 서버(infra/micro/demo-idp)는 mcp-server와 같은 의존성으로 돈다.
      - name: 경량판 demo-idp 테스트
        if: matrix.service == 'mcp-server'
        working-directory: infra/micro/demo-idp
        run: python -m unittest -v test_idp
      - name: 의존성 취약점(pip-audit)
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off

  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: 모니터링 리소스가 infra/observability와 같은지 확인
        run: python3 infra/k8s/components/monitoring/generate.py --check
      - name: 경량판 compose 구성 검사
        run: |
          sed "s/=$/=ci-only/" infra/micro/.env.example > infra/micro/.env   # 빈 값은 compose가 거부한다
          docker compose -f infra/micro/docker-compose.yml config -q
          bash -n infra/micro/server-setup.sh infra/micro/deploy.sh
      - name: 경보 규칙 문법(promtool)
        run: |
          docker run --rm -v "$PWD/infra/observability:/obs:ro" --entrypoint promtool prom/prometheus:v3.15.0 check rules /obs/alerts.yml
      - name: kustomize build + kubeconform(CRD 포함)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for o in local ncp; do kubectl kustomize infra/k8s/overlays/$o > /tmp/$o.yaml; done
          ./kubeconform -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/local.yaml /tmp/ncp.yaml infra/argocd/ infra/k8s/components/backup/restore-job.yaml

  # 전체 스택(docker compose)을 띄우고 역할별 브라우저 시나리오·접근성·CSP를 확인한다.
  e2e:
    needs: [backend, frontend, python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 스택 기동
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 600
      - name: 시나리오 실행
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE=http://localhost:8088 OUT=./screenshots node suite.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

  # 이미지 빌드 → 취약점 검사(수정 가능한 HIGH·CRITICAL이 있으면 실패) → main·태그에서만 NCP Container Registry에 푸시
  images:
    needs: [backend, frontend, python, k8s]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: twin-api, context: backend}
          - {name: frontend, context: frontend}
          - {name: mcp-server, context: mcp-server}
          - {name: ai-agent, context: ai-agent}
          - {name: keycloak, context: infra/keycloak}
          - {name: postgis, context: infra/postgis}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: 빌드
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: 이미지 취약점(Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ${{ env.TRIVY_IMAGE }} image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scan/${{ matrix.name }}:${{ github.sha }}
      - name: 푸시
        if: github.event_name == 'push' && vars.NCR_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.NCR_REGISTRY }}
          NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
          NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}
        # NCP Container Registry: 사용자명·비밀번호에 API 인증키(Access/Secret Key)를 쓴다.
        # main은 커밋 SHA 태그, v* 태그는 버전 태그(예: v0.2.0 → 0.2.0)로 올린다.
        run: |
          echo "$NCP_SECRET_KEY" | docker login "$REGISTRY" -u "$NCP_ACCESS_KEY" --password-stdin
          tag="${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME#v}"; fi
          docker tag "scan/${{ matrix.name }}:${GITHUB_SHA}" "$REGISTRY/${{ matrix.name }}:$tag"
          docker push "$REGISTRY/${{ matrix.name }}:$tag"
