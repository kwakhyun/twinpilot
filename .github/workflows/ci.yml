name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # 통합 테스트는 Testcontainers로 postgis/postgis:16-3.5를 띄운다.
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e "mcp-server[test]" -e "ai-agent[test]"
      - run: pytest -q mcp-server
      - run: pytest -q ai-agent

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: kustomize build + kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for o in local ncp; do kubectl kustomize infra/k8s/overlays/$o > /tmp/$o.yaml; done
          ./kubeconform -strict -summary -kubernetes-version 1.34.0 /tmp/local.yaml /tmp/ncp.yaml

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, python, k8s]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, mcp-server, ai-agent]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # NCP Container Registry: 사용자명·비밀번호에 API 인증키(Access/Secret Key)를 쓴다.
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.NCR_REGISTRY }}
          username: ${{ secrets.NCP_ACCESS_KEY }}
          password: ${{ secrets.NCP_SECRET_KEY }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ vars.NCR_REGISTRY }}/${{ matrix.service == 'backend' && 'twin-api' || matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
