[project]
name = "twinpilot-agent"
version = "0.2.0"
description = "TwinPilot AI copilot: LangGraph agent + MCP client + Claude"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-anthropic>=1.7.5,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "mcp>=1.30,<2",
    "anthropic>=1.12,<2",
    "fastapi>=0.143,<0.144",
    "uvicorn>=0.54,<0.55",
    "httpx>=0.28,<0.29",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.15,<3",
    "prometheus-client>=0.26,<1",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinpilot_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
