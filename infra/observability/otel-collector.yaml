# OTLP(HTTP·gRPC)로 받은 추적을 배치·메모리 제한 후 Jaeger로 보낸다.
# 운영(NCP)에서는 exporters를 사용하는 추적 백엔드(예: Tempo, Jaeger, 상용 APM)로 바꾼다.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
  # 헬스체크·메트릭 수집 요청은 추적에서 뺀다.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/healthz"'
        - 'IsMatch(attributes["url.path"], "^/actuator/.*")'
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/noise, batch]
      exporters: [otlp/jaeger]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
