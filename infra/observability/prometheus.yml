global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: twin-api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["twin-api:8081"] }]
  - job_name: mcp-server
    static_configs: [{ targets: ["mcp-server:8090"] }]
  - job_name: ai-agent
    static_configs: [{ targets: ["ai-agent:8000"] }]
  - job_name: keycloak
    metrics_path: /auth/metrics
    static_configs: [{ targets: ["keycloak:9000"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
