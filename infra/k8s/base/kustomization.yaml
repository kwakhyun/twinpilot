apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: twinpilot
labels:
  - pairs:
      app.kubernetes.io/part-of: twinpilot
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - postgis.yaml
  - twin-api.yaml
  - mcp-server.yaml
  - ai-agent.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: twinpilot/twin-api
    newTag: 0.1.0
  - name: twinpilot/mcp-server
    newTag: 0.1.0
  - name: twinpilot/ai-agent
    newTag: 0.1.0
  - name: twinpilot/frontend
    newTag: 0.1.0
