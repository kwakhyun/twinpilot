apiVersion: v1
kind: Service
metadata:
  name: postgis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgis
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgis
    spec:
      serviceAccountName: twinpilot
      securityContext:
        fsGroup: 999
      containers:
        - name: postgis
          image: postgis/postgis:16-3.5
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: twinpilot
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: twinpilot-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: twinpilot-secrets
                  key: DB_PASSWORD
            # 블록 스토리지 루트의 lost+found와 충돌하지 않도록 하위 디렉터리를 쓴다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d twinpilot"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d twinpilot"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
