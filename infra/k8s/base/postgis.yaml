apiVersion: v1
kind: Service
metadata:
  name: postgis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgis
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgis
    spec:
      serviceAccountName: twinpilot
      terminationGracePeriodSeconds: 60
      # 이미지의 postgres 사용자(uid·gid 999)로 바로 실행한다. 데이터 볼륨은 fsGroup으로 쓰기 권한을 준다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgis
          image: postgis/postgis:16-3.5
          # 커넥션 예산: twin-api(최대 6×20) + keycloak(2×20) + ai-agent(최대 4×10) + 백업·부트스트랩 여유
          args: ["-c", "max_connections=250", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1GB"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: twinpilot
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: twinpilot-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: twinpilot-secrets
                  key: DB_PASSWORD
            # 블록 스토리지 루트의 lost+found와 충돌하지 않도록 하위 디렉터리를 쓴다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d twinpilot"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d twinpilot"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # 병렬 쿼리용 동적 공유 메모리(기본 64Mi로는 부족할 수 있다)
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
