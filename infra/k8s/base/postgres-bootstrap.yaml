# keycloak·agent 데이터베이스와 사용자를 만든다(멱등). 배포마다 다시 실행해도 안전하고, 비밀번호 교체도 반영한다.
# Argo CD에서는 Sync 훅으로 매번 실행된다(기존 Job은 성공 후 삭제).
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 20          # PostGIS가 뜰 때까지 재시도
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-bootstrap
    spec:
      serviceAccountName: twinpilot
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgis/postgis:16-3.5
          command: ["psql", "-h", "postgis", "-U", "$(PGUSER)", "-d", "twinpilot", "-f", "/sql/init-databases.sql"]
          env:
            - name: PGUSER
              valueFrom:
                configMapKeyRef: {name: twinpilot-config, key: DB_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: twinpilot-secrets, key: DB_PASSWORD}
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: twinpilot-secrets, key: KEYCLOAK_DB_PASSWORD}
            - name: AGENT_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: twinpilot-secrets, key: AGENT_DB_PASSWORD}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: sql, mountPath: /sql}
      volumes:
        - name: sql
          configMap:
            name: postgres-bootstrap-sql
