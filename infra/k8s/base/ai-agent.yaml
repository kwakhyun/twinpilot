apiVersion: v1
kind: Service
metadata:
  name: ai-agent
spec:
  selector:
    app.kubernetes.io/name: ai-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
spec:
  # 대화 상태는 agent 데이터베이스(PostgreSQL 체크포인트)에 있으므로 레플리카를 늘려도 세션이 이어진다.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: twinpilot
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-agent
          image: twinpilot/ai-agent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: twinpilot-config
          env:
            # 없으면 규칙 기반 플래너로 동작한다(AGENT_MODE=auto).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: twinpilot-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            # 사용자 토큰을 MCP용 토큰으로 교환할 때 쓰는 클라이언트 시크릿
            - name: AGENT_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: twinpilot-secrets, key: AGENT_CLIENT_SECRET}
            # postgres-bootstrap Job이 만든 agent 데이터베이스. 비밀번호는 URL에 그대로 들어가므로 영숫자로 만든다.
            - name: AGENT_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: twinpilot-secrets, key: AGENT_DB_PASSWORD}
            - name: CHECKPOINT_DB_URL
              value: postgresql://agent:$(AGENT_DB_PASSWORD)@postgis:5432/agent
          readinessProbe:
            httpGet:
              path: /agent/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /agent/health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
