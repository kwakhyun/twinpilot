apiVersion: v1
kind: Service
metadata:
  name: ai-agent
spec:
  selector:
    app.kubernetes.io/name: ai-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
spec:
  # 대화 상태가 메모리에 있으면 1개로 둔다. CHECKPOINT_DB_URL(PostgreSQL)을 주면 여러 개로 확장할 수 있다.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-agent
    spec:
      serviceAccountName: twinpilot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-agent
          image: twinpilot/ai-agent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: twinpilot-config
          env:
            # 없으면 규칙 기반 플래너로 동작한다(AGENT_MODE=auto).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: twinpilot-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: CHECKPOINT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: twinpilot-secrets
                  key: CHECKPOINT_DB_URL
                  optional: true
          readinessProbe:
            httpGet:
              path: /agent/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /agent/health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
