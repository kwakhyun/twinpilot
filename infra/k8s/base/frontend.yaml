apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      serviceAccountName: twinpilot
      securityContext:
        runAsNonRoot: true
        # nginx(uid·gid 101)가 템플릿 치환 결과를 emptyDir에 쓸 수 있도록 그룹 소유권을 맞춘다.
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: twinpilot/frontend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TWIN_API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: twinpilot-config
                  key: TWIN_API_UPSTREAM
            - name: AGENT_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: twinpilot-config
                  key: AGENT_UPSTREAM
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx 템플릿 치환 결과·pid·임시 파일 경로
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
