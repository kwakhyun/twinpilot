apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      serviceAccountName: twinpilot
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # nginx(uid·gid 101)가 템플릿 치환 결과를 emptyDir에 쓸 수 있도록 그룹 소유권을 맞춘다.
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: twinpilot/frontend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TWIN_API_UPSTREAM
              valueFrom:
                configMapKeyRef: {name: twinpilot-config, key: TWIN_API_UPSTREAM}
            - name: AGENT_UPSTREAM
              valueFrom:
                configMapKeyRef: {name: twinpilot-config, key: AGENT_UPSTREAM}
            - name: KEYCLOAK_UPSTREAM
              valueFrom:
                configMapKeyRef: {name: twinpilot-config, key: KEYCLOAK_UPSTREAM}
            - name: AUTH_MODE
              valueFrom:
                configMapKeyRef: {name: twinpilot-config, key: AUTH_MODE}
            - name: OIDC_AUTHORITY
              valueFrom:
                configMapKeyRef: {name: twinpilot-config, key: OIDC_AUTHORITY}
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef: {name: twinpilot-config, key: OIDC_CLIENT_ID}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          lifecycle:
            # SSE 연결이 남아 있어도 새 요청이 들어오지 않도록 엔드포인트 제거가 전파될 시간을 준다.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx 템플릿 치환 결과·pid·임시 파일 경로
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
