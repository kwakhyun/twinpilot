apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: twinpilot
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: twinpilot/mcp-server
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: twinpilot-config
          env:
            # 에이전트 토큰을 twin-api용 토큰으로 교환할 때 쓰는 클라이언트 시크릿
            - name: MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: twinpilot-secrets, key: MCP_CLIENT_SECRET}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
