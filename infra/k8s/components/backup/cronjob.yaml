# 매일 03:17(KST) 백업. init 컨테이너가 덤프를 만들고, 본 컨테이너가 Object Storage로 올린다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "17 3 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          serviceAccountName: twinpilot
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              # 서버와 같은 이미지(같은 메이저 버전의 pg_dump)를 쓴다.
              image: twinpilot/postgis
              command: ["sh", "/scripts/dump.sh"]
              env:
                - name: PGHOST
                  value: postgis
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef: {name: twinpilot-config, key: DB_USER}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: twinpilot-secrets, key: DB_PASSWORD}
                - name: BACKUP_DATABASES
                  value: twinpilot keycloak agent
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext:
                runAsUser: 70
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: backup, mountPath: /backup}
          containers:
            - name: upload
              image: amazon/aws-cli:2.37.12
              command: ["bash", "/scripts/upload.sh"]
              env:
                - name: BACKUP_S3_ENDPOINT
                  valueFrom:
                    configMapKeyRef: {name: twinpilot-config, key: BACKUP_S3_ENDPOINT}
                - name: BACKUP_S3_BUCKET
                  valueFrom:
                    configMapKeyRef: {name: twinpilot-config, key: BACKUP_S3_BUCKET}
                - name: BACKUP_RETENTION_DAYS
                  valueFrom:
                    configMapKeyRef: {name: twinpilot-config, key: BACKUP_RETENTION_DAYS}
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    configMapKeyRef: {name: twinpilot-config, key: BACKUP_S3_REGION}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: twinpilot-secrets, key: S3_ACCESS_KEY}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: twinpilot-secrets, key: S3_SECRET_KEY}
                # S3 호환 저장소가 새 기본 체크섬(CRC) 헤더를 지원하지 않아도 동작하도록 필요할 때만 보낸다.
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: HOME
                  value: /tmp
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext:
                runAsUser: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap:
                name: postgres-backup-scripts
            - name: backup
              emptyDir:
                sizeLimit: 20Gi
            - name: tmp
              emptyDir: {}
