# 로컬 클러스터(kind 등) 검증용
#   kind load docker-image twinpilot/twin-api:0.1.0 ... (이미지 4종)
#   kubectl apply -k infra/k8s/overlays/local
#   kubectl -n twinpilot port-forward svc/frontend 8088:8080
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
secretGenerator:
  - name: twinpilot-secrets
    namespace: twinpilot
    literals:
      - DB_PASSWORD=twin-local
      # 대화 상태를 PostgreSQL에 두어 ai-agent를 2개로 띄워도 세션이 이어지게 한다.
      - CHECKPOINT_DB_URL=postgresql://twin:twin-local@postgis:5432/twinpilot
replicas:
  - name: ai-agent
    count: 2
patches:
  - target:
      kind: Ingress
      name: twinpilot
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: nginx
  # kind에 미리 적재한 이미지를 쓴다.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
