# TwinPilot 로컬 전체 스택
#   docker compose -f infra/docker-compose.yml up -d --build
#   → http://localhost:8088
# LLM 모드: ANTHROPIC_API_KEY를 셸 환경에 두면 ai-agent가 claude-opus-5-5로 동작한다(없으면 규칙 기반).
name: twinpilot

services:
  postgis:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: twinpilot
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-twin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twinpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  twin-api:
    image: twinpilot/twin-api:0.1.0
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgis:5432/twinpilot
      DB_USER: twin
      DB_PASSWORD: ${DB_PASSWORD:-twin}
      SEED_ENABLED: "true"
    volumes:
      - models:/data/storage
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      # 런타임 이미지에 curl이 없어 bash의 /dev/tcp로 readiness를 확인한다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30

  mcp-server:
    image: twinpilot/mcp-server:0.1.0
    build: ../mcp-server
    environment:
      TWIN_API_URL: http://twin-api:8080
    depends_on:
      twin-api:
        condition: service_healthy

  ai-agent:
    image: twinpilot/ai-agent:0.1.0
    build: ../ai-agent
    environment:
      MCP_URL: http://mcp-server:8090/mcp
      AGENT_MODE: ${AGENT_MODE:-auto}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - mcp-server

  frontend:
    image: twinpilot/frontend:0.1.0
    build: ../frontend
    ports:
      - "8088:8080"
    depends_on:
      - twin-api
      - ai-agent

volumes:
  pgdata:
  models:
